name: Atualizar catalogo
on:
  push:
    paths: ["games/**"]
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 gerar-catalogo.py
      - name: Salvar games.json
        run: |
          git config user.name "catalogo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add games/games.json
          git diff --staged --quiet || (git commit -m "Atualiza catalogo" && git push)
